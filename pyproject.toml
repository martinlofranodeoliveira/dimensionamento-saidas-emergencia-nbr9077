[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dimensionamento-saidas-emergencia-nbr9077"
version = "1.0.0"
description = "Dimensionamento de Saídas de Emergência em Edifícios (ABNT NBR 9077:2001) - Lofrano Tecnologia"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Lofrano Tecnologia", email = "contato@lofranotecnologia.com.br" }
]
keywords = [
    "engenharia-de-incendio",
    "abnt-nbr-9077",
    "saidas-de-emergencia",
    "unidades-de-passagem",
    "rotas-de-fuga",
    "formula-de-blondel",
    "prevencao-panico",
    "zero-float",
    "lofrano-tecnologia"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
saidas-nbr9077 = "saidas_nbr9077.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
saidas_nbr9077 = ["py.typed"]
